services:
  neo4j:
    image: neo4j:5.26.32-community
    container_name: moviegraph-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - moviegraph_neo4j_data:/data
      - moviegraph_neo4j_logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -a bolt://localhost:7687 -u neo4j -p "$${NEO4J_PASSWORD}" "RETURN 1" >/dev/null 2>&1 || exit 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  moviegraph_neo4j_data:
    name: moviegraph_neo4j_data
  moviegraph_neo4j_logs:
    name: moviegraph_neo4j_logs
